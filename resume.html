<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f5f0">
  <title>Private portfolio</title>
  <link rel="stylesheet" href="gate.css">
  <script src="gate.js" defer></script>
</head>
<body>
  <main class="gate" id="gate" aria-labelledby="gate-title">
    <div class="gate-card">
      <span class="gate-mark" aria-hidden="true">YH</span>
      <h1 id="gate-title">Private portfolio</h1>
      <p>Enter your access password to view the portfolio.</p>
      <form method="post" id="unlock-form" aria-describedby="unlock-status">
        <label for="access-password">Password</label>
        <div class="gate-fields">
          <input id="access-password" type="password" required
                 autocomplete="current-password" autocapitalize="none" spellcheck="false">
          <button id="unlock-button" type="submit" disabled>Unlock <span aria-hidden="true">→</span></button>
        </div>
        <p id="unlock-status" role="status" aria-live="polite"></p>
      </form>
      <noscript><p>Enable JavaScript in your browser to unlock this portfolio.</p></noscript>
    </div>
  </main>
  <iframe id="portfolio" title="Portfolio" hidden></iframe>
  <button id="lock-button" type="button" hidden>Lock</button>
</body>
</html>
